[project]
name = "bedrock-lens"
version = "0.1.0"
description = "Evidence-backed binary intelligence for Minecraft Bedrock"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lunar" }]
dependencies = []

[project.optional-dependencies]
analysis = [
    "pyghidra>=3.1,<4",
]

[project.scripts]
lens = "bedrock_lens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_lens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: exercises installed external analysis tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
